<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AADS TOC 2026 — QR Scanner</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #050505; --panel: #111; --panel-2: #161616; --line: #2a2a2a;
      --text: #f5f5f5; --muted: #888; --gold: #f5c518; --gold-2: #ffe066;
      --green: #16a34a; --green-bg: #052b12; --green-text: #6ee7a0;
      --red: #dc2626; --red-bg: #2b0505; --red-text: #fca5a5;
      --amber: #d97706; --amber-bg: #2b1800; --amber-text: #fcd34d;
      --darkred-bg: #1a0202; --darkred-text: #ff8080;
    }
    html, body { height: 100%; }
    body { background: var(--bg); color: var(--text); font-family: "Segoe UI", system-ui, sans-serif; overflow: hidden; }
    .hidden { display: none !important; }

    /* ── PIN ── */
    .pin-wrap { display: flex; align-items: center; justify-content: center; height: 100vh; padding: 24px; }
    .pin-card { padding: 36px 32px; border: 1px solid #2a2a2a; border-radius: 22px; background: var(--panel); max-width: 380px; width: 100%; }
    .pin-eye { color: var(--gold); font-size: 11px; font-weight: 900; letter-spacing: 0.32em; text-transform: uppercase; margin-bottom: 10px; }
    .pin-title { font-size: 24px; font-weight: 900; margin-bottom: 20px; }
    .pin-input { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #2a2a2a; background: #0a0a0a; color: var(--text); font-size: 24px; font-weight: 900; letter-spacing: 0.3em; text-align: center; font-family: inherit; outline: none; transition: border-color 120ms; }
    .pin-input:focus { border-color: var(--gold); }
    .pin-input.err { border-color: #cc4444; }
    .pin-error { font-size: 13px; color: #fca5a5; text-align: center; margin-top: 8px; }
    .pin-btn { width: 100%; margin-top: 14px; padding: 13px; border-radius: 12px; border: 0; background: linear-gradient(90deg, var(--gold), var(--gold-2)); color: #090909; font-size: 14px; font-weight: 900; letter-spacing: 0.2em; text-transform: uppercase; cursor: pointer; }
    .staff-input { width: 100%; padding: 13px 14px; border-radius: 12px; border: 1px solid #2a2a2a; background: #0a0a0a; color: var(--text); font-size: 15px; font-family: inherit; outline: none; margin-bottom: 12px; transition: border-color 120ms; }
    .staff-input:focus { border-color: var(--gold); }
    .staff-label { font-size: 12px; color: var(--muted); margin-bottom: 6px; letter-spacing: 0.1em; text-transform: uppercase; }

    /* ── SCANNER UI ── */
    #scannerUI { display: flex; flex-direction: column; height: 100vh; }
    .scan-header { background: #080808; border-bottom: 1px solid #1a1a1a; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .scan-header-left { display: flex; flex-direction: column; }
    .scan-header-event { font-size: 10px; color: var(--gold); font-weight: 900; letter-spacing: 0.28em; text-transform: uppercase; }
    .scan-header-title { font-size: 15px; font-weight: 900; }
    .staff-chip { font-size: 11px; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 20px; padding: 5px 12px; color: var(--muted); cursor: pointer; }
    .staff-chip:hover { border-color: #444; }

    .scan-body { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    /* Camera view */
    #cameraView { flex: 1; position: relative; background: #000; }
    #reader { width: 100%; height: 100%; }
    #reader video { object-fit: cover; width: 100% !important; height: 100% !important; }
    .scan-frame { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(260px, 70vw); height: min(260px, 70vw); pointer-events: none; z-index: 2; }
    .scan-frame::before, .scan-frame::after { content: ''; position: absolute; width: 40px; height: 40px; border-color: var(--gold); border-style: solid; border-width: 3px; }
    .scan-frame::before { top: 0; left: 0; border-right: none; border-bottom: none; border-radius: 4px 0 0 0; }
    .scan-frame::after { bottom: 0; right: 0; border-left: none; border-top: none; border-radius: 0 0 4px 0; }
    .scan-frame-tl, .scan-frame-tr, .scan-frame-bl, .scan-frame-br { display: none; }

    .scan-hint { position: absolute; bottom: 16px; left: 0; right: 0; text-align: center; font-size: 12px; color: rgba(255,255,255,0.5); pointer-events: none; z-index: 2; }

    /* Manual input bar */
    .manual-bar { background: #080808; border-top: 1px solid #1a1a1a; padding: 10px 14px; display: flex; gap: 8px; flex-shrink: 0; }
    .manual-input { flex: 1; background: #0e0e0e; border: 1px solid #2a2a2a; border-radius: 10px; color: var(--text); font-family: monospace; font-size: 13px; padding: 9px 12px; outline: none; transition: border-color 120ms; }
    .manual-input:focus { border-color: var(--gold); }
    .manual-submit { background: var(--gold); color: #090909; border: 0; border-radius: 10px; padding: 9px 18px; font-weight: 900; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer; white-space: nowrap; }

    /* ── RESULT OVERLAY ── */
    #resultOverlay { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start; }
    #resultOverlay.hidden { display: none !important; }

    .result-header { padding: 20px 24px 16px; flex-shrink: 0; }
    .result-badge { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 900; letter-spacing: 0.18em; text-transform: uppercase; }
    .result-body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; }
    .result-icon { font-size: 72px; margin-bottom: 16px; line-height: 1; }
    .result-name { font-size: clamp(22px, 6vw, 34px); font-weight: 900; margin-bottom: 8px; line-height: 1.15; }
    .result-sub { font-size: 15px; opacity: 0.8; margin-bottom: 6px; }
    .result-sub2 { font-size: 13px; opacity: 0.65; }
    .result-bracelet { display: inline-flex; align-items: center; gap: 8px; margin-top: 14px; padding: 10px 22px; border-radius: 40px; font-size: 14px; font-weight: 900; letter-spacing: 0.14em; text-transform: uppercase; }
    .result-footer { padding: 16px 24px 32px; flex-shrink: 0; display: flex; flex-direction: column; gap: 10px; }
    .result-confirm-btn { width: 100%; padding: 18px; border-radius: 16px; border: 0; font-size: 16px; font-weight: 900; letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer; }
    .result-next-btn { width: 100%; padding: 14px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.7); font-size: 14px; font-weight: 700; cursor: pointer; letter-spacing: 0.1em; }

    /* colour schemes */
    #resultOverlay.state-valid      { background: var(--green-bg); }
    #resultOverlay.state-confirmed  { background: #021a0a; }
    #resultOverlay.state-already-in { background: var(--red-bg); }
    #resultOverlay.state-not-found  { background: var(--amber-bg); }
    #resultOverlay.state-void       { background: var(--darkred-bg); }
    #resultOverlay.state-unpaid     { background: var(--amber-bg); }

    .state-valid .result-confirm-btn      { background: var(--green); color: #fff; }
    .state-already-in .result-confirm-btn { display: none; }
    .state-not-found .result-confirm-btn  { display: none; }
    .state-void .result-confirm-btn       { display: none; }
    .state-unpaid .result-confirm-btn     { display: none; }
    .state-confirmed .result-confirm-btn  { display: none; }

    .state-valid .result-name       { color: var(--green-text); }
    .state-confirmed .result-name   { color: var(--green-text); }
    .state-already-in .result-name  { color: var(--red-text); }
    .state-not-found .result-name   { color: var(--amber-text); }
    .state-void .result-name        { color: var(--darkred-text); }
    .state-unpaid .result-name      { color: var(--amber-text); }

    .state-valid .result-bracelet { background: rgba(255,255,255,0.1); color: #fff; }

    /* Loading spinner */
    .spin { display: inline-block; width: 32px; height: 32px; border: 3px solid #333; border-top-color: var(--gold); border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- Staff name gate -->
  <div id="pinWrap" class="pin-wrap">
    <div class="pin-card">
      <div class="pin-eye">AADS Door Scanner</div>
      <h1 class="pin-title">TOC 2026 · QR Scanner</h1>
      <input class="pin-input" type="password" inputmode="numeric" maxlength="4"
        id="staffCode" placeholder="••••" autocomplete="off"
        onkeydown="if(event.key==='Enter')unlock()" oninput="clearErr()" />
      <div id="pinErr" class="pin-error hidden">Invalid staff code.</div>
      <button class="pin-btn" onclick="unlock()">Start Scanning</button>
    </div>
  </div>

  <!-- Scanner UI -->
  <div id="scannerUI" class="hidden">
    <div class="scan-header">
      <div class="scan-header-left">
        <span class="scan-header-event">TOC 2026 · Door Scanner</span>
        <span class="scan-header-title">📷 Scan Guest Tickets</span>
      </div>
      <div class="staff-chip" onclick="changeStaff()" id="staffChip">—</div>
    </div>

    <div class="scan-body">
      <div id="cameraView">
        <div id="reader"></div>
        <div class="scan-frame"></div>
        <div class="scan-hint">Point camera at QR code on ticket</div>
      </div>
      <div class="manual-bar">
        <input class="manual-input" type="text" id="manualInput" placeholder="Ticket code — type or paste" />
        <button class="manual-submit" onclick="submitManual()">Check →</button>
      </div>
    </div>
  </div>

  <!-- Result overlay -->
  <div id="resultOverlay" class="hidden">
    <div class="result-header">
      <div class="result-badge" id="resultBadge"></div>
    </div>
    <div class="result-body">
      <div class="result-icon" id="resultIcon"></div>
      <div class="result-name" id="resultName"></div>
      <div class="result-sub" id="resultSub"></div>
      <div class="result-sub2" id="resultSub2"></div>
      <div class="result-bracelet" id="resultBracelet"></div>
    </div>
    <div class="result-footer">
      <button class="result-confirm-btn" id="confirmBtn" onclick="confirmCheckin()">
        ✅ Confirm Check-In &amp; Issue Bracelet
      </button>
      <button class="result-next-btn" onclick="resetScanner()">Scan Next Ticket</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://gygwhznblajojwveikhg.supabase.co'
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd5Z3doem5ibGFqb2p3dmVpa2hnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMzNjU5NzgsImV4cCI6MjA4ODk0MTk3OH0.BI9KlRsCxAvNnFHCGq6hjXfdsaNgo7afY4Xa5uxwjak'
    const HDR = {
      apikey: SUPABASE_ANON_KEY,
      Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
      'Content-Type': 'application/json'
    }

    const STAFF_CODES = {
      '0010': 'Matthew',
      '0011': 'Kayla',
      '0012': 'Tanya',
      '0013': 'Aubrey',
      '0014': 'Connie',
      '0015': 'Jayme',
      '0016': 'Jason'
    }

    let staffName = ''
    let currentTicket = null
    let html5QrCode = null
    let scannerRunning = false

    function tryAutoLogin() {
      try {
        const session = JSON.parse(localStorage.getItem('aads_staff_session'))
        if (session?.name) {
          staffName = session.name
          document.getElementById('pinWrap').classList.add('hidden')
          document.getElementById('scannerUI').classList.remove('hidden')
          document.getElementById('staffChip').textContent = `👤 ${staffName}`
          startScanner()
          return true
        }
      } catch {}
      return false
    }

    function unlock() {
      const code = document.getElementById('staffCode').value.trim()
      const name = STAFF_CODES[code]
      if (!name) {
        document.getElementById('staffCode').classList.add('err')
        document.getElementById('pinErr').classList.remove('hidden')
        document.getElementById('staffCode').focus()
        return
      }
      staffName = name
      sessionStorage.setItem('toc_staff', name)
      document.getElementById('pinWrap').classList.add('hidden')
      document.getElementById('scannerUI').classList.remove('hidden')
      document.getElementById('staffChip').textContent = `👤 ${staffName}`
      startScanner()
    }

    function clearErr() {
      document.getElementById('staffCode').classList.remove('err')
      document.getElementById('pinErr').classList.add('hidden')
    }

    function changeStaff() {
      stopScanner()
      document.getElementById('scannerUI').classList.add('hidden')
      document.getElementById('pinWrap').classList.remove('hidden')
      document.getElementById('staffCode').value = ''
      document.getElementById('pinErr').classList.add('hidden')
      document.getElementById('staffCode').focus()
    }

    // ── SCANNER ──
    async function startScanner() {
      if (scannerRunning) return
      html5QrCode = new Html5Qrcode('reader', { verbose: false })
      try {
        await html5QrCode.start(
          { facingMode: 'environment' },
          { fps: 10, qrbox: { width: 250, height: 250 }, aspectRatio: 1.0 },
          onScanSuccess
        )
        scannerRunning = true
      } catch (e) {
        console.warn('Camera failed:', e)
      }
    }

    async function stopScanner() {
      if (html5QrCode && scannerRunning) {
        try { await html5QrCode.stop() } catch {}
        scannerRunning = false
      }
    }

    async function onScanSuccess(decodedText) {
      if (!scannerRunning) return
      await stopScanner()
      await processScan(decodedText.trim())
    }

    function submitManual() {
      const val = document.getElementById('manualInput').value.trim()
      if (!val) return
      document.getElementById('manualInput').value = ''
      processScan(val)
    }

    // ── PROCESS SCAN ──
    async function processScan(code) {
      showOverlay('state-not-found', '⏳', 'Checking…', '', '', '', '')

      let ticket
      try {
        const res = await fetch(
          `${SUPABASE_URL}/rest/v1/toc_tickets?ticket_code=eq.${encodeURIComponent(code)}&select=*`,
          { headers: HDR }
        )
        const rows = await res.json()
        ticket = rows[0]
      } catch {
        showOverlay('state-not-found', '⚠️', 'Network Error', 'Could not reach the server.', 'Check your connection and try again.', '', '')
        return
      }

      if (!ticket) {
        showOverlay('state-not-found', '⚠️', 'Ticket Not Found', 'QR code not recognised in the system.', 'Ask guest to show their confirmation email.', '', '')
        return
      }

      if (ticket.ticket_status === 'VOID') {
        showOverlay('state-void', '🚫', 'Ticket Void', 'This ticket has been cancelled.', 'Do not allow entry. Contact admin immediately.', '', '')
        return
      }

      if (ticket.payment_status === 'PENDING_PAYMENT' || ticket.payment_status === 'UNPAID') {
        showOverlay('state-unpaid', '⚠️', 'Payment Pending', `${ticket.ticket_holder_name || 'Guest'}`, 'E-transfer not yet confirmed. Contact admin.', '', '')
        return
      }

      if (ticket.checked_in) {
        const checkinTime = ticket.checked_in_at
          ? new Date(ticket.checked_in_at).toLocaleTimeString('en-CA', { hour: '2-digit', minute: '2-digit' })
          : 'earlier'
        showOverlay('state-already-in', '🔴', 'Already Checked In',
          ticket.ticket_holder_name || ticket.ticket_code,
          `Checked in at ${checkinTime} by ${ticket.checked_in_by || 'staff'}`,
          `Scanned ${(ticket.scan_count || 1)} time(s)`,
          '')
        await bumpScanCount(ticket)
        return
      }

      // Valid — show confirm button
      currentTicket = ticket
      const isVIP = ticket.ticket_type === 'VIP'
      const bracelet = isVIP ? '🟠 ORANGE VIP WRISTBAND' : '⚪ WHITE GA WRISTBAND'
      const typeLine = isVIP
        ? `VIP · Table ${ticket.table_number} · Seat ${ticket.seat_number}`
        : `General Admission · ${ticket.ticket_code}`

      showOverlay('state-valid', '✅', ticket.ticket_holder_name || 'Valid Ticket', typeLine, ticket.ticket_code, bracelet, '')
    }

    function showOverlay(stateClass, icon, name, sub, sub2, bracelet, badge) {
      const overlay = document.getElementById('resultOverlay')
      overlay.className = stateClass
      document.getElementById('resultIcon').textContent = icon
      document.getElementById('resultName').textContent = name
      document.getElementById('resultSub').textContent = sub
      document.getElementById('resultSub2').textContent = sub2
      document.getElementById('resultBracelet').textContent = bracelet
      document.getElementById('resultBracelet').style.display = bracelet ? '' : 'none'
      overlay.classList.remove('hidden')
    }

    async function confirmCheckin() {
      if (!currentTicket) return
      document.getElementById('confirmBtn').disabled = true
      document.getElementById('confirmBtn').textContent = 'Recording…'

      const now = new Date().toISOString()
      try {
        await fetch(
          `${SUPABASE_URL}/rest/v1/toc_tickets?ticket_code=eq.${encodeURIComponent(currentTicket.ticket_code)}`,
          {
            method: 'PATCH',
            headers: { ...HDR, Prefer: 'return=minimal' },
            body: JSON.stringify({
              checked_in: true,
              checked_in_at: now,
              checked_in_by: staffName,
              scan_count: 1,
              last_scanned_at: now
            })
          }
        )
      } catch (e) {
        document.getElementById('confirmBtn').disabled = false
        document.getElementById('confirmBtn').textContent = '✅ Confirm Check-In & Issue Bracelet'
        alert('Network error — try again')
        return
      }

      const isVIP = currentTicket.ticket_type === 'VIP'
      const bracelet = isVIP ? '🟠 ORANGE VIP WRISTBAND' : '⚪ WHITE GA WRISTBAND'
      showOverlay('state-confirmed', '🟢',
        `${currentTicket.ticket_holder_name || 'Guest'} — IN`,
        isVIP ? `VIP · Table ${currentTicket.table_number} · Seat ${currentTicket.seat_number}` : `General Admission · ${currentTicket.ticket_code}`,
        'Bracelet issued · Guest admitted',
        bracelet, '')

      currentTicket = null
      setTimeout(() => resetScanner(), 4000)
    }

    async function bumpScanCount(ticket) {
      const now = new Date().toISOString()
      await fetch(
        `${SUPABASE_URL}/rest/v1/toc_tickets?ticket_code=eq.${encodeURIComponent(ticket.ticket_code)}`,
        {
          method: 'PATCH',
          headers: { ...HDR, Prefer: 'return=minimal' },
          body: JSON.stringify({
            scan_count: (ticket.scan_count || 1) + 1,
            last_scanned_at: now
          })
        }
      ).catch(() => {})
    }

    async function resetScanner() {
      currentTicket = null
      document.getElementById('resultOverlay').classList.add('hidden')
      document.getElementById('confirmBtn').disabled = false
      document.getElementById('confirmBtn').textContent = '✅ Confirm Check-In & Issue Bracelet'
      await startScanner()
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (!tryAutoLogin()) {
        const restored = sessionStorage.getItem('toc_staff')
        if (restored) document.getElementById('staffCode').value = restored
      }
      document.getElementById('manualInput').addEventListener('keydown', e => {
        if (e.key === 'Enter') submitManual()
      })
    })
  </script>
</body>
</html>
