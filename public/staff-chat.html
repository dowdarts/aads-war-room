<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#050505" />
  <link rel="manifest" href="staff-chat.webmanifest" />
  <link rel="icon" href="icon-event-chat.png" />
  <link rel="apple-touch-icon" href="icon-event-chat.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>AADS Event Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #050505;
      --panel: #111111;
      --panel-2: #161616;
      --line: #242424;
      --text: #f5f5f5;
      --muted: #999;
      --accent: #ff7a00;
      --accent-2: #ffb347;
    }
    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    .hidden { display: none !important; }

    /* ══ HERO ══ */
    .hero {
      background: linear-gradient(180deg, #0e0805 0%, #050505 100%);
      border-bottom: 1px solid #1a1a1a;
      padding: 22px 24px 18px;
      text-align: center;
    }
    .hero-logo { width: 96px; max-width: 100%; height: auto; margin-bottom: 8px; }
    .hero-eyebrow { font-size: 11px; font-weight: 900; letter-spacing: 0.38em; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; }
    .hero-title { font-size: clamp(24px, 4vw, 36px); font-weight: 900; letter-spacing: -0.03em; }
    .hero-title em { font-style: normal; background: linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .hero-install-btn {
      margin-top: 12px; background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
      font-size: 12px; font-weight: 700; padding: 8px 16px; border-radius: 999px; cursor: pointer; transition: border-color 0.15s;
    }
    .hero-install-btn:hover { border-color: var(--accent); }
    .hero-alerts-btn {
      margin-top: 8px; background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
      font-size: 12px; font-weight: 700; padding: 8px 16px; border-radius: 999px; cursor: pointer; transition: border-color 0.15s;
    }
    .hero-alerts-btn:hover { border-color: var(--accent); }
    .hero-alerts-btn.on { border-color: #22c55e; color: #22c55e; }

    /* ══ SIGN-IN NEEDED ══ */
    .sign-in-needed { max-width: 360px; margin: 60px auto; padding: 28px; text-align: center; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; }
    .sign-in-needed p { color: var(--muted); font-size: 14px; line-height: 1.6; }
    .login-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
    .login-field label { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
    .login-field input {
      background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 11px 14px;
      color: var(--text); font-size: 15px; outline: none; text-align: center; letter-spacing: 0.5em; transition: border-color 0.15s;
    }
    .login-field input::placeholder { letter-spacing: normal; color: #555; }
    .login-field input:focus { border-color: var(--accent); }
    .login-submit-btn {
      width: 100%; background: var(--accent); color: #1a0a00; font-size: 14px; font-weight: 800;
      border: none; border-radius: 10px; padding: 12px; cursor: pointer; transition: background 0.15s;
    }
    .login-submit-btn:hover { background: var(--accent-2); }
    .login-submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .login-msg { font-size: 13px; text-align: center; padding: 9px; border-radius: 8px; margin-bottom: 14px; display: none; }
    .login-msg.error { background: #3b1010; color: #f87171; display: block; }

    /* ══ CHAT LAYOUT ══ */
    .chat-app { max-width: 1100px; margin: 0 auto; padding: 20px; height: calc(100vh - 95px); }
    .chat-layout { display: grid; grid-template-columns: 280px 1fr; height: 100%; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; background: var(--panel); }

    .contact-pane { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
    .pane-header { padding: 14px 16px; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); border-bottom: 1px solid var(--line); }
    .me-label { color: var(--accent); margin-left: 6px; text-transform: none; letter-spacing: 0; }
    .contact-list { flex: 1; overflow-y: auto; }
    .contact-row { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 12px 16px; border: none; border-bottom: 1px solid var(--line); background: transparent; color: var(--text); cursor: pointer; }
    .contact-row:hover, .contact-row.active { background: var(--panel-2); }
    .contact-row-text { flex: 1; min-width: 0; }
    .contact-name { font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
    .unread-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); display: inline-block; flex-shrink: 0; }
    .online-dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; display: inline-block; flex-shrink: 0; }
    .contact-preview { font-size: 11px; color: var(--muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .empty-note { color: var(--muted); font-size: 13px; text-align: center; padding: 30px 16px; }
    .delete-conv-btn { background: none; border: none; color: #555; font-size: 13px; cursor: pointer; padding: 4px; flex-shrink: 0; }
    .delete-conv-btn:hover { color: #ff6b6b; }
    .msg-meta { display: flex; align-items: center; gap: 8px; margin-top: 3px; }
    .delete-msg-btn { background: none; border: none; color: #444; font-size: 10px; cursor: pointer; padding: 0; }
    .delete-msg-btn:hover { color: #ff6b6b; }

    .thread-pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
    .thread-empty { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 13px; text-align: center; padding: 0 20px; }
    .thread-active-inner { display: flex; flex-direction: column; flex: 1; min-height: 0; }
    .thread-header { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
    .back-btn { display: none; background: none; border: none; color: var(--text); font-size: 18px; cursor: pointer; padding: 0 4px; }
    .thread-contact-name { font-size: 14px; font-weight: 800; }
    .thread-messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
    .msg-row { display: flex; flex-direction: column; max-width: 70%; }
    .msg-row.mine { align-self: flex-end; align-items: flex-end; }
    .msg-row.theirs { align-self: flex-start; align-items: flex-start; }
    .msg-bubble { padding: 9px 13px; border-radius: 14px; font-size: 13px; line-height: 1.4; word-break: break-word; }
    .msg-row.mine .msg-bubble { background: var(--accent); color: #1a0a00; border-bottom-right-radius: 4px; }
    .msg-row.theirs .msg-bubble { background: var(--panel-2); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
    .msg-time { font-size: 10px; color: var(--muted); }
    .msg-image { max-width: 200px; max-height: 200px; border-radius: 14px; border: 1px solid var(--line); display: block; object-fit: cover; }
    .thread-input-row { display: flex; gap: 10px; padding: 14px 16px; border-top: 1px solid var(--line); }
    .thread-input-row input[type="text"] { flex: 1; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; color: var(--text); font-size: 13px; }
    .thread-input-row input[type="text"]:focus { outline: none; border-color: var(--accent); }
    .thread-input-row button { background: var(--accent); color: #1a0a00; border: none; border-radius: 10px; padding: 10px 18px; font-weight: 800; font-size: 13px; cursor: pointer; }
    .thread-input-row .photo-btn { background: #262626; color: #fff; border: 1px solid #444; border-radius: 10px; padding: 8px 14px; font-size: 19px; cursor: pointer; line-height: 1; }
    .thread-input-row .photo-btn:disabled { opacity: 0.5; cursor: default; }

    @media (max-width: 720px) {
      .chat-app { padding: 0; height: calc(100vh - 85px); }
      .chat-layout { grid-template-columns: 1fr; border-radius: 0; border: none; }
      .thread-pane { display: none; }
      .chat-layout.thread-active .contact-pane { display: none; }
      .chat-layout.thread-active .thread-pane { display: flex; }
      .back-btn { display: inline-block; }
    }
  </style>
</head>
<body>

  <div class="hero">
    <img class="hero-logo" src="icon-event-chat.png" alt="AADS Event Chat" />
    <div class="hero-eyebrow">AADS War Room</div>
    <h1 class="hero-title">Event <em>Chat</em></h1>
    <br />
    <button type="button" id="installBtn" class="hero-install-btn hidden">📲 Add to Home Screen</button>
    <button type="button" id="alertsBtn" class="hero-alerts-btn hidden">🔔 Enable Alerts</button>
  </div>

  <div id="signInNeeded" class="sign-in-needed hidden">
    <div class="login-field">
      <label>Account Code</label>
      <input type="password" inputmode="numeric" maxlength="6" id="pinInput" placeholder="Enter your code" autofocus />
    </div>
    <div id="loginMsg" class="login-msg"></div>
    <button type="button" class="login-submit-btn" id="loginSubmitBtn">Sign In</button>
  </div>

  <div id="chatApp" class="chat-app hidden">
    <div class="chat-layout" id="chatLayout">
      <div class="contact-pane">
        <div class="pane-header">Event<span id="meLabel" class="me-label"></span></div>
        <div class="contact-list" id="contactList"></div>
      </div>
      <div class="thread-pane">
        <div id="threadEmpty" class="thread-empty">
          <p>Select a staff member to start chatting.</p>
        </div>
        <div id="threadActive" class="thread-active-inner hidden">
          <div class="thread-header">
            <button type="button" id="backToContactsBtn" class="back-btn">&larr;</button>
            <span id="threadContactName" class="thread-contact-name"></span>
          </div>
          <div class="thread-messages" id="threadMessages"></div>
          <div class="thread-input-row">
            <input type="file" id="imageInput" accept="image/*" class="hidden" />
            <button type="button" id="photoBtn" class="photo-btn" title="Send a photo">📷</button>
            <input type="text" id="msgInput" placeholder="Type a message…" />
            <button type="button" id="sendBtn">Send</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    /* ══ CONSTANTS ══ */
    var SUPABASE_URL = 'https://gygwhznblajojwveikhg.supabase.co'
    var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd5Z3doem5ibGFqb2p3dmVpa2hnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMzNjU5NzgsImV4cCI6MjA4ODk0MTk3OH0.BI9KlRsCxAvNnFHCGq6hjXfdsaNgo7afY4Xa5uxwjak'
    var hdrs = { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY }
    var SESSION_KEY = 'aads_staff_session'
    var PLAYER_SESSION_KEY = 'aads_player_session'
    var SCOREKEEPER_SESSION_KEY = 'aads_scorekeeper_session'
    var LASTREAD_PREFIX = 'aads_chat_lastread_'
    var POLL_MS = 2000
    var HEARTBEAT_MS = 30000
    var CONTACTS_POLL_MS = 15000
    var ONLINE_THRESHOLD_MS = 90000
    var IMAGE_BUCKET = 'staff-chat-images'
    var IMAGE_MAX_DIM = 1600
    var IMAGE_QUALITY = 0.8

    function isOnline(c) {
      if (!c.last_seen_at) return false
      return Date.now() - new Date(c.last_seen_at).getTime() < ONLINE_THRESHOLD_MS
    }

    /* ══ STATE ══ */
    var me = null
    var contacts = []
    var allMessages = []
    var activeContactId = null
    var lastMessagesJSON = ''

    /* ══ SESSION ══ */
    function loadSession() {
      try { return JSON.parse(localStorage.getItem(SESSION_KEY)) } catch (e) { return null }
    }
    function saveSession(s) { localStorage.setItem(SESSION_KEY, JSON.stringify(s)) }

    // A player/scorekeeper who never explicitly clicked "Continue as Staff"
    // has no aads_staff_session, even though their staff_accounts row exists
    // (every claimed account gets one via the unify trigger). Resolve their
    // chat identity from whichever portal session they DO have, without
    // writing to aads_staff_session — that key also unlocks the full Staff
    // Dashboard elsewhere in the app, which is a lot more than just chat.
    function loadFallbackDisplayName() {
      try {
        var p = JSON.parse(localStorage.getItem(PLAYER_SESSION_KEY))
        if (p && p.displayName) return p.displayName
      } catch (e) {}
      try {
        var s = JSON.parse(localStorage.getItem(SCOREKEEPER_SESSION_KEY))
        if (s && s.displayName) return s.displayName
      } catch (e) {}
      return null
    }

    function resolveFallbackSession(displayName) {
      var url = SUPABASE_URL + '/rest/v1/staff_accounts?name=ilike.' + encodeURIComponent(displayName) +
        '&select=id,name,is_active,is_claimed&limit=1'
      return fetch(url, { headers: hdrs })
        .then(function (r) { return r.json() })
        .then(function (rows) {
          if (!Array.isArray(rows) || !rows.length) return null
          var row = rows[0]
          if (row.is_active === false || row.is_claimed === false) return null
          return { id: row.id, name: row.name, isMaster: false, loginAt: Date.now() }
        })
        .catch(function () { return null })
    }

    /* ══ DATA ══ */
    function loadContacts() {
      var url = SUPABASE_URL + '/rest/v1/staff_accounts?select=id,name,last_seen_at&is_active=eq.true&is_claimed=eq.true&order=name.asc'
      fetch(url, { headers: hdrs })
        .then(function (r) { return r.json() })
        .then(function (rows) {
          contacts = (Array.isArray(rows) ? rows : []).filter(function (c) { return c.id !== me.id })
          renderContacts()
          renderThread()
        })
        .catch(function () {})
    }

    function fetchMessages() {
      var url = SUPABASE_URL + '/rest/v1/staff_messages?or=(sender_id.eq.' + me.id + ',recipient_id.eq.' + me.id + ')&order=created_at.asc'
      return fetch(url, { headers: hdrs })
        .then(function (r) { return r.json() })
        .then(function (rows) { return Array.isArray(rows) ? rows : [] })
        .catch(function () { return [] })
    }

    function tick() {
      fetchMessages().then(function (rows) {
        var json = JSON.stringify(rows)
        if (json !== lastMessagesJSON) {
          lastMessagesJSON = json
          allMessages = rows
          renderContacts()
          renderThread()
        }
      })
    }

    function conversationWith(otherId) {
      return allMessages.filter(function (m) {
        return (m.sender_id === otherId && m.recipient_id === me.id) || (m.sender_id === me.id && m.recipient_id === otherId)
      })
    }

    function isUnread(otherId) {
      var conv = conversationWith(otherId)
      if (!conv.length) return false
      var lastMsg = conv[conv.length - 1]
      if (lastMsg.sender_id === me.id) return false
      var lastRead = localStorage.getItem(LASTREAD_PREFIX + otherId)
      if (!lastRead) return true
      return new Date(lastMsg.created_at) > new Date(lastRead)
    }

    function markRead(otherId) {
      var conv = conversationWith(otherId)
      var lastTime = conv.length ? conv[conv.length - 1].created_at : new Date().toISOString()
      localStorage.setItem(LASTREAD_PREFIX + otherId, lastTime)
    }

    /* ══ RENDERING ══ */
    function escapeHtml(s) {
      return (s || '').replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
      })
    }

    function formatTime(iso) {
      try { return new Date(iso).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) } catch (e) { return '' }
    }

    function renderContacts() {
      var wrap = document.getElementById('contactList')
      wrap.innerHTML = ''
      if (!contacts.length) { wrap.innerHTML = '<p class="empty-note">No other staff yet.</p>'; return }
      contacts.forEach(function (c) {
        var conv = conversationWith(c.id)
        var lastMsg = conv.length ? conv[conv.length - 1] : null
        var preview = lastMsg ? (lastMsg.image_url ? '📷 Photo' : lastMsg.body) : 'No messages yet'
        var unread = isUnread(c.id)
        var row = document.createElement('div')
        row.className = 'contact-row' + (c.id === activeContactId ? ' active' : '')
        var textHtml =
          '<div class="contact-row-text">' +
          '<div class="contact-name">' + (isOnline(c) ? '<span class="online-dot" title="Online now"></span>' : '') +
          escapeHtml(c.name) + (unread ? '<span class="unread-dot"></span>' : '') + '</div>' +
          '<div class="contact-preview">' + escapeHtml(preview.length > 44 ? preview.slice(0, 44) + '…' : preview) + '</div>' +
          '</div>'
        row.innerHTML = conv.length
          ? textHtml + '<button type="button" class="delete-conv-btn" title="Delete conversation with ' + escapeHtml(c.name) + '">🗑</button>'
          : textHtml
        row.addEventListener('click', function () { selectContact(c.id) })
        if (conv.length) {
          row.querySelector('.delete-conv-btn').addEventListener('click', function (e) {
            e.stopPropagation()
            deleteConversation(c.id)
          })
        }
        wrap.appendChild(row)
      })
    }

    function deleteMessage(id) {
      if (typeof id !== 'string' || id.indexOf('temp_') === 0) return
      allMessages = allMessages.filter(function (m) { return m.id !== id })
      lastMessagesJSON = JSON.stringify(allMessages)
      renderContacts()
      renderThread()
      fetch(SUPABASE_URL + '/rest/v1/staff_messages?id=eq.' + id, {
        method: 'DELETE',
        headers: hdrs
      }).catch(function () {})
    }

    function deleteConversation(otherId) {
      var contact = contacts.find(function (c) { return c.id === otherId })
      if (!window.confirm('Delete this entire conversation with ' + (contact ? contact.name : 'this person') + '? This can\'t be undone.')) return
      allMessages = allMessages.filter(function (m) {
        return !((m.sender_id === otherId && m.recipient_id === me.id) || (m.sender_id === me.id && m.recipient_id === otherId))
      })
      lastMessagesJSON = JSON.stringify(allMessages)
      if (activeContactId === otherId) {
        activeContactId = null
        backToContacts()
      }
      renderContacts()
      renderThread()
      var filterExpr = 'or=(and(sender_id.eq.' + me.id + ',recipient_id.eq.' + otherId + '),and(sender_id.eq.' + otherId + ',recipient_id.eq.' + me.id + '))'
      fetch(SUPABASE_URL + '/rest/v1/staff_messages?' + filterExpr, {
        method: 'DELETE',
        headers: hdrs
      }).catch(function () {})
    }

    function selectContact(id) {
      activeContactId = id
      markRead(id)
      document.getElementById('chatLayout').classList.add('thread-active')
      renderContacts()
      renderThread()
      document.getElementById('msgInput').focus()
    }

    function backToContacts() {
      document.getElementById('chatLayout').classList.remove('thread-active')
    }

    function renderThread() {
      if (!activeContactId) {
        document.getElementById('threadEmpty').classList.remove('hidden')
        document.getElementById('threadActive').classList.add('hidden')
        return
      }
      document.getElementById('threadEmpty').classList.add('hidden')
      document.getElementById('threadActive').classList.remove('hidden')

      var contact = contacts.find(function (c) { return c.id === activeContactId })
      document.getElementById('threadContactName').innerHTML = contact
        ? escapeHtml(contact.name) + (isOnline(contact) ? ' <span class="online-dot" title="Online now"></span>' : '')
        : '…'

      var pane = document.getElementById('threadMessages')
      var conv = conversationWith(activeContactId)
      pane.innerHTML = ''
      if (!conv.length) {
        pane.innerHTML = '<p class="empty-note">Say hello — no messages yet.</p>'
      } else {
        conv.forEach(function (m) {
          var mine = m.sender_id === me.id
          var row = document.createElement('div')
          row.className = 'msg-row ' + (mine ? 'mine' : 'theirs')
          var bodyHtml = m.image_url
            ? '<a href="' + m.image_url + '" target="_blank" rel="noopener noreferrer"><img class="msg-image" src="' + m.image_url + '" alt="Shared" /></a>'
            : '<div class="msg-bubble">' + escapeHtml(m.body) + '</div>'
          row.innerHTML =
            bodyHtml +
            '<div class="msg-meta"><span class="msg-time">' + formatTime(m.created_at) + '</span>' +
            '<button type="button" class="delete-msg-btn" title="Delete message">🗑</button></div>'
          row.querySelector('.delete-msg-btn').addEventListener('click', function () { deleteMessage(m.id) })
          pane.appendChild(row)
        })
      }
      pane.scrollTop = pane.scrollHeight
      markRead(activeContactId)
    }

    /* ══ PRESENCE ══ */
    function heartbeat() {
      fetch(SUPABASE_URL + '/rest/v1/staff_accounts?id=eq.' + me.id, {
        method: 'PATCH',
        headers: Object.assign({}, hdrs, { 'Content-Type': 'application/json', Prefer: 'return=minimal' }),
        body: JSON.stringify({ last_seen_at: new Date().toISOString() })
      }).catch(function () {})
    }

    /* ══ ACTIONS ══ */
    // Sent right after a message insert succeeds — not via a DB hook, same
    // pattern cue-light.html uses for its own portal push calls.
    function notifyChatPush(recipientId, preview) {
      fetch(SUPABASE_URL + '/functions/v1/send-staff-chat-push', {
        method: 'POST',
        headers: Object.assign({}, hdrs, { 'Content-Type': 'application/json' }),
        body: JSON.stringify({ recipientId: recipientId, senderName: me.name, preview: preview })
      }).catch(function () {})
    }

    function sendMessage() {
      var input = document.getElementById('msgInput')
      var body = input.value.trim()
      if (!body || !activeContactId) return
      var contact = contacts.find(function (c) { return c.id === activeContactId })
      if (!contact) return
      input.value = ''

      var optimistic = {
        id: 'temp_' + Date.now(),
        sender_id: me.id, sender_name: me.name,
        recipient_id: contact.id, recipient_name: contact.name,
        body: body, created_at: new Date().toISOString()
      }
      allMessages.push(optimistic)
      lastMessagesJSON = JSON.stringify(allMessages)
      renderThread()
      renderContacts()

      fetch(SUPABASE_URL + '/rest/v1/staff_messages', {
        method: 'POST',
        headers: Object.assign({}, hdrs, { 'Content-Type': 'application/json', Prefer: 'return=minimal' }),
        body: JSON.stringify({
          sender_id: me.id, sender_name: me.name,
          recipient_id: contact.id, recipient_name: contact.name,
          body: body
        })
      }).then(function () { notifyChatPush(contact.id, body) }).catch(function () {})
    }

    function compressImage(file) {
      return new Promise(function (resolve, reject) {
        var img = new Image()
        var reader = new FileReader()
        reader.onload = function () {
          img.onload = function () {
            var width = img.width, height = img.height
            if (width > IMAGE_MAX_DIM || height > IMAGE_MAX_DIM) {
              if (width > height) { height = Math.round(height * IMAGE_MAX_DIM / width); width = IMAGE_MAX_DIM }
              else { width = Math.round(width * IMAGE_MAX_DIM / height); height = IMAGE_MAX_DIM }
            }
            var canvas = document.createElement('canvas')
            canvas.width = width
            canvas.height = height
            canvas.getContext('2d').drawImage(img, 0, 0, width, height)
            canvas.toBlob(function (blob) { blob ? resolve(blob) : reject(new Error('compress failed')) }, 'image/jpeg', IMAGE_QUALITY)
          }
          img.onerror = reject
          img.src = reader.result
        }
        reader.onerror = reject
        reader.readAsDataURL(file)
      })
    }

    function sendImage(file) {
      if (!file || !activeContactId) return
      var contact = contacts.find(function (c) { return c.id === activeContactId })
      if (!contact) return
      var photoBtn = document.getElementById('photoBtn')
      photoBtn.disabled = true
      photoBtn.textContent = '…'
      var tempId = 'temp_' + Date.now()

      compressImage(file).then(function (blob) {
        var localUrl = URL.createObjectURL(blob)
        allMessages.push({
          id: tempId,
          sender_id: me.id, sender_name: me.name,
          recipient_id: contact.id, recipient_name: contact.name,
          body: '', image_url: localUrl, created_at: new Date().toISOString()
        })
        lastMessagesJSON = JSON.stringify(allMessages)
        renderThread()
        renderContacts()

        var filename = me.id + '_' + Date.now() + '.jpg'
        return fetch(SUPABASE_URL + '/storage/v1/object/' + IMAGE_BUCKET + '/' + filename, {
          method: 'POST',
          headers: Object.assign({}, hdrs, { 'Content-Type': 'image/jpeg' }),
          body: blob
        }).then(function (res) {
          if (!res.ok) throw new Error('upload failed')
          var imageUrl = SUPABASE_URL + '/storage/v1/object/public/' + IMAGE_BUCKET + '/' + filename
          return fetch(SUPABASE_URL + '/rest/v1/staff_messages', {
            method: 'POST',
            headers: Object.assign({}, hdrs, { 'Content-Type': 'application/json', Prefer: 'return=minimal' }),
            body: JSON.stringify({
              sender_id: me.id, sender_name: me.name,
              recipient_id: contact.id, recipient_name: contact.name,
              body: '', image_url: imageUrl
            })
          }).then(function () { notifyChatPush(contact.id, '') })
        })
      }).catch(function () {
        allMessages = allMessages.filter(function (m) { return m.id !== tempId })
        lastMessagesJSON = JSON.stringify(allMessages)
        renderThread()
        renderContacts()
        window.alert('Could not send image. Try again.')
      }).then(function () {
        photoBtn.disabled = false
        photoBtn.textContent = '📷'
      })
    }

    function wireUI() {
      document.getElementById('sendBtn').addEventListener('click', sendMessage)
      document.getElementById('msgInput').addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage() }
      })
      document.getElementById('backToContactsBtn').addEventListener('click', backToContacts)
      document.getElementById('photoBtn').addEventListener('click', function () {
        document.getElementById('imageInput').click()
      })
      document.getElementById('imageInput').addEventListener('change', function (e) {
        var file = e.target.files && e.target.files[0]
        e.target.value = ''
        sendImage(file)
      })
    }

    /* ══ INSTALL (Add to Home Screen) ══ */
    var deferredInstallPrompt = null
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault()
      deferredInstallPrompt = e
    })

    function isIOSDevice() {
      return /iP(hone|od|ad)/.test(navigator.platform) ||
        (navigator.userAgent.includes('Mac') && 'ontouchend' in document)
    }

    function isStandalone() {
      return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true
    }

    function installApp() {
      if (deferredInstallPrompt) {
        deferredInstallPrompt.prompt()
        deferredInstallPrompt = null
        return
      }
      if (isIOSDevice()) {
        alert('Tap the Share icon, then choose "Add to Home Screen".')
      } else {
        alert('Use your browser menu and choose "Add to Home Screen" or "Install app".')
      }
    }

    function wireInstallButton() {
      var btn = document.getElementById('installBtn')
      btn.addEventListener('click', installApp)
      if (!isStandalone()) btn.classList.remove('hidden')
    }

    /* ══ NOTIFICATIONS ══ */
    var VAPID_PUBLIC_KEY = 'BPIESfNBbD2RClDErwjAvB0j-PVya6bFBves1iLElnl17vmvuF3V1PymOPgAHt7KD0tE3gV944mWZeKrztR1_38'

    function registerChatSW() {
      if (!('serviceWorker' in navigator)) return Promise.resolve(null)
      return navigator.serviceWorker.register('staff-chat-sw.js', { scope: '/staff-chat.html' }).catch(function () { return null })
    }

    function urlBase64ToUint8Array(base64String) {
      var padding = '='.repeat((4 - base64String.length % 4) % 4)
      var base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/')
      var rawData = window.atob(base64)
      var outputArray = new Uint8Array(rawData.length)
      for (var i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i)
      return outputArray
    }

    function saveChatSubscription(sub) {
      var json = sub.toJSON()
      return fetch(SUPABASE_URL + '/rest/v1/staff_chat_push_subscriptions?on_conflict=endpoint', {
        method: 'POST',
        headers: Object.assign({}, hdrs, { 'Content-Type': 'application/json', Prefer: 'resolution=merge-duplicates,return=minimal' }),
        body: JSON.stringify({ account_id: me.id, endpoint: json.endpoint, p256dh: json.keys.p256dh, auth: json.keys.auth })
      }).then(function (res) {
        if (!res.ok) {
          return res.text().then(function (body) {
            throw new Error('Save subscription failed (' + res.status + '): ' + body)
          })
        }
      })
    }

    function subscribeToChatPush() {
      return registerChatSW().then(function (registration) {
        if (!registration || !registration.pushManager) {
          throw new Error('Push is not supported in this browser/mode.')
        }
        return registration.pushManager.getSubscription().then(function (existing) {
          return existing || registration.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
          })
        })
      }).then(function (sub) {
        if (sub) return saveChatSubscription(sub)
      })
    }

    function setAlertsBtnState(on) {
      var btn = document.getElementById('alertsBtn')
      btn.textContent = on ? '🔔 Alerts On' : '🔔 Enable Alerts'
      btn.classList.toggle('on', on)
    }

    function enableChatAlerts() {
      if (!('Notification' in window)) { alert('Notifications are not supported in this browser.'); return }
      if (isIOSDevice() && !isStandalone()) {
        alert('On iPhone, notifications only work once this page is added to the Home Screen — tap 📲 Add to Home Screen first, then open it from that icon and try again.')
        return
      }
      Notification.requestPermission().then(function (perm) {
        if (perm !== 'granted') { alert('Notifications were not enabled.'); return }
        subscribeToChatPush().then(function () {
          setAlertsBtnState(true)
        }).catch(function (e) {
          console.error('Push subscribe failed', e)
          alert('Push setup failed: ' + (e && e.message ? e.message : e))
        })
      })
    }

    function wireAlertsButton() {
      var btn = document.getElementById('alertsBtn')
      btn.classList.remove('hidden')
      btn.addEventListener('click', enableChatAlerts)
      setAlertsBtnState(('Notification' in window) && Notification.permission === 'granted')
    }

    /* ══ LOGIN ══ */
    function showLoginMsg(text) {
      var el = document.getElementById('loginMsg')
      el.textContent = text
      el.className = 'login-msg error'
    }
    function hideLoginMsg() {
      var el = document.getElementById('loginMsg')
      el.className = 'login-msg'
    }

    function login() {
      var pin = document.getElementById('pinInput').value.trim()
      if (pin.length < 4) { showLoginMsg('Enter your staff code.'); return }
      var btn = document.getElementById('loginSubmitBtn')
      btn.disabled = true
      btn.textContent = 'Verifying…'
      fetch(SUPABASE_URL + '/rest/v1/staff_accounts?pin=eq.' + pin + '&select=id,name,is_master,is_active,is_claimed', { headers: hdrs })
        .then(function (r) { return r.json() })
        .then(function (rows) {
          if (!Array.isArray(rows)) { showLoginMsg('Connection error. Try again.'); btn.disabled = false; btn.textContent = 'Sign In'; return }
          if (!rows.length) { showLoginMsg('Code not recognized. Try again.'); btn.disabled = false; btn.textContent = 'Sign In'; return }
          if (rows[0].is_active === false) { showLoginMsg('This account is paused. Contact Matthew.'); btn.disabled = false; btn.textContent = 'Sign In'; return }
          if (rows[0].is_claimed === false) { showLoginMsg('Set up your account first from the main sign-in page.'); btn.disabled = false; btn.textContent = 'Sign In'; return }
          saveSession({ id: rows[0].id, name: rows[0].name, isMaster: rows[0].is_master, loginAt: Date.now() })
          me = loadSession()
          document.getElementById('signInNeeded').classList.add('hidden')
          startChatApp()
        })
        .catch(function () {
          showLoginMsg('Connection error. Try again.')
          btn.disabled = false
          btn.textContent = 'Sign In'
        })
    }

    function wireLogin() {
      var pinInput = document.getElementById('pinInput')
      pinInput.addEventListener('input', function () {
        pinInput.value = pinInput.value.replace(/\D/g, '').slice(0, 6)
        hideLoginMsg()
      })
      pinInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') login() })
      document.getElementById('loginSubmitBtn').addEventListener('click', login)
      pinInput.focus()
    }

    /* ══ INIT ══ */
    function startChatApp() {
      document.getElementById('chatApp').classList.remove('hidden')
      document.getElementById('meLabel').textContent = me.name
      wireUI()
      wireAlertsButton()
      loadContacts()
      setInterval(loadContacts, CONTACTS_POLL_MS)
      tick()
      setInterval(tick, POLL_MS)
      heartbeat()
      setInterval(heartbeat, HEARTBEAT_MS)
    }

    function showSignInNeeded() {
      document.getElementById('signInNeeded').classList.remove('hidden')
      wireLogin()
    }

    document.addEventListener('DOMContentLoaded', function () {
      wireInstallButton()
      me = loadSession()
      if (me && me.id) { startChatApp(); return }

      var fallbackName = loadFallbackDisplayName()
      if (!fallbackName) { showSignInNeeded(); return }
      resolveFallbackSession(fallbackName).then(function (s) {
        if (!s) { showSignInNeeded(); return }
        me = s
        startChatApp()
      })
    })
  </script>
</body>
